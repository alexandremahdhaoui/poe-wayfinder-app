[package]
name = "poe-trader-app"
version = "0.1.0"
edition = "2021"
description = "Overlay, adapters and drivers for poe-trader."

[dependencies]
poe-trader-core = { path = "../poe-trader-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true

# The overlay only exists on Windows. Behind a target gate so the Linux build,
# where every test runs, never pulls them in.
[target.'cfg(windows)'.dependencies]
arboard = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
] }

[dev-dependencies]
mockall.workspace = true
tokio = { workspace = true }
