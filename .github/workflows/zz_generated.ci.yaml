# CI for poe-wayfinder-app.
#
# One job. It runs forge test-all which is the same gate used locally. A
# separate job scans dependencies and writes an SBOM.

name: poe-wayfinder-app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install forge
        run: go install github.com/alexandremahdhaoui/forge/cmd/forge@latest

      - name: Create envrc
        run: touch .envrc

      - name: forge test-all
        run: forge test-all

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: poe-wayfinder-app.spdx.json

      - name: Scan for known vulnerabilities
        uses: anchore/scan-action@v5
        with:
          path: .
          fail-build: true
          severity-cutoff: high
