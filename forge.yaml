name: poe-wayfinder-app

artifactStorePath: .forge/artifact-store.yaml

# forge v0.42.0 ships no native Rust engines, so every stage wraps cargo
# through generic-builder and generic-test-runner.
build:
  # Pull the config spec from the workspace, or from a pinned tag when this
  # repo is built alone.
  - name: resolve-spec
    src: .
    engine: go://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/poe-wayfinder-spec
          spec/poe-wayfinder.v1.yaml .forge/spec-cache

  # Emit config, logging, telemetry and resilience for all three binaries.
  # golden-configgen is pinned by tag so it cannot move under us.
  - name: generate-config
    src: .
    engine: go://generic-builder
    spec:
      command: go
      args:
        - run
        - github.com/alexandremahdhaoui/golden-configgen/cmd/golden-configgen@v0.1.0
        - --spec
        - .forge/spec-cache/poe-wayfinder.v1.yaml
        - --root
        - .

  - name: format-code
    src: .
    engine: go://generic-builder
    spec:
      command: cargo
      args: ["fmt", "-p", "poe-wayfinder-app"]

  - name: poe-wayfinder-app
    src: ./src
    engine: go://generic-builder
    spec:
      command: cargo
      args: ["build", "-p", "poe-wayfinder-app", "--release"]

  # The overlay only makes sense on Windows. cargo has no --out-dir on stable,
  # so the binary is copied out of the shared workspace target dir.
  #
  # generic-builder and not go://go-build. forge v0.42.0 passes spec.env to its
  # own dependency detector, which then fails to compile for Windows.
  - name: poe-wayfinder-windows
    src: ./src
    engine: go://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo build --release --target x86_64-pc-windows-gnu
          -p poe-wayfinder-app --bin poe-wayfinder &&
          cp ../target/x86_64-pc-windows-gnu/release/poe-wayfinder.exe
          /mnt/c/Users/alexa/Desktop/testbin/poe-wayfinder.exe

test:
  # Generated modules are excluded from lint standards, so clippy is scoped to
  # this package and the generated files carry their own allow attributes.
  - name: lint
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["clippy", "-p", "poe-wayfinder-app", "--all-targets", "--", "-D", "warnings"]

  - name: format-check
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["fmt", "-p", "poe-wayfinder-app", "--", "--check"]

  - name: unit
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["test", "-p", "poe-wayfinder-app"]

  # The only end to end harness gate that is safe to automate. It is hermetic:
  # no Windows host, no network, about a second. It checks every log message a
  # harness greps for still exists in the Rust, so a renamed line fails here
  # rather than silently turning every assertion built on it into a grep for a
  # string that can never appear.
  #
  # No other harness belongs in forge. They need a Windows desktop and six of
  # them hit GGG, and the rate limiter is not optional.
  - name: harness-lint
    runner: go://generic-test-runner
    spec:
      command: bash
      args: ["hack/harness-lint.sh"]

  # How much of the reference is ported, as a number rather than an opinion.
  #
  # The floor only ever goes up. Raising it is how a port stops being a claim
  # and starts being a measurement. It passes with no reference checkout, so a
  # machine without one can still build.
  - name: parity
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo run --quiet --release --bin poe-wayfinder-parity --
          --min 100

  # The overlay runtime, measured against the other reference.
  #
  # Awakened PoE Trade's Electron shell was waved off as "replaced rather than
  # ported" and never measured. It held real logic, and skipping it hid that
  # the overlay could not whisper a seller at all. It is measured now so that
  # cannot happen again quietly.
  - name: parity-overlay
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo run --quiet --release --bin poe-wayfinder-parity --
          --reference ../reference/awakened-poe-trade/main/src
          --subdirs shortcuts,host-files,windowing
          --min 100

  # The PoE1 price check logic, measured against the reference that owns it.
  #
  # Exiled Exchange 2 is a PoE2 fork and drops what PoE1 needs. Its influence
  # filter is commented out, its heist rules are gone and half its parser
  # stages for PoE1 items went with them. Measuring only that reference read
  # 100 percent while PoE1 was missing 23 functions.
  #
  # The floor only ever goes up.
  # The thirteen widgets. Scanned separately from `parity` because they are
  # .vue rather than .ts, and they were invisible to the measurement until the
  # scanner learned to read a script block.
  - name: parity-widgets
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo run --quiet --release --bin poe-wayfinder-parity --
          --subdirs web/overlay,web/settings,web/background,web/library,web/map-check,web/item-search,web/item-check,web/client-log,web/stash-search,web/leveling,web/stopwatch,web/notepad,web/help
          --min 100

  - name: parity-poe1
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo run --quiet --release --bin poe-wayfinder-parity --
          --reference ../reference/awakened-poe-trade/renderer/src
          --min 100

  # How much of each game's data file the parser can read back.
  #
  # Parity counts functions. This counts stats, which is what a wrong parser
  # actually costs. Both games sat at 92 percent while every test passed,
  # because the trade data keys some stats with a leading plus and the parser
  # dropped it. A missed stat is a missing filter, not an error.
  #
  # It passes when no data directory is present, so a fresh checkout still
  # builds. The data is generated by poe-wayfinder-datagen and not committed.
  - name: architecture
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo run --quiet --release --bin poe-wayfinder-arch --
          --root . --max 0

  - name: uiparity
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          cargo run --quiet --release --bin poe-wayfinder-uiparity --
          --min 100

  - name: datacheck
    runner: go://generic-test-runner
    spec:
      command: sh
      args:
        - -c
        - >-
          dirs=""; for d in data-poe1 data-poe2; do [ -f "$d/stats.ndjson" ] &&
          dirs="$dirs $d"; done;
          if [ -z "$dirs" ]; then
          echo "datacheck: no data directory, run poe-wayfinder-datagen first";
          exit 0; fi;
          cargo run --quiet --release --bin poe-wayfinder-datacheck -- $dirs
          --min 99.9
